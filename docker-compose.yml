services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4

  retention-cleanup:
    build: ./backend
    env_file:
      - ./backend/.env
    depends_on:
      - backend
    restart: unless-stopped
    command: >
      sh -ec 'while true; do
      python scripts/prune_current_visit_records.py;
      touch /tmp/retention-cleanup-heartbeat;
      sleep 300;
      done'
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/retention-cleanup-heartbeat && test $(find /tmp/retention-cleanup-heartbeat -mmin -10)"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 2m

  voice-agent:
    build: ./backend
    env_file:
      - ./backend/.env
    restart: unless-stopped
    entrypoint: ["python", "-m", "app.voice.agent", "start"]

  dashboard:
    build: ./dashboard
    env_file:
      - ./dashboard/.env
    environment:
      WORKBAI_BACKEND_INTERNAL_URL: http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/ssl/workbay:/etc/ssl/workbay:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - dashboard
    restart: unless-stopped
