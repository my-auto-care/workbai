# Use only on the isolated Workbai test runtime. This file deliberately avoids host ports 80/443.
# The host reverse proxy owns public TLS for test.workbay.autorepairsolutions.ai.
name: workbai-test

services:
  migrate:
    build: ./backend
    env_file:
      - ./backend/.env.test
    restart: "no"
    command: alembic upgrade head

  backend:
    build: ./backend
    env_file:
      - ./backend/.env.test
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:18000:8000"
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2

  dashboard:
    build: ./dashboard
    env_file:
      - ./dashboard/.env.test
    environment:
      WORKBAI_BACKEND_INTERNAL_URL: http://backend:8000
    depends_on:
      - backend
    ports:
      - "127.0.0.1:13000:3000"
    restart: unless-stopped
