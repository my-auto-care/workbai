events { worker_connections 1024; }

http {
    client_max_body_size 20M;
    # Keep Current Visit disabled until trusted ingress/real-IP configuration is proven.
    limit_req_zone $binary_remote_addr zone=workbai_current_visit_ip:10m rate=10r/m;
    upstream backend {
        server backend:8000;
        keepalive 32;
    }

    # Re-resolve Docker hostnames every 10s (prevents stale IP after container rebuilds)
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream dashboard {
        server 167.99.153.77:3000;
    }

    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location ^~ /v/ { access_log off; return 404; }
        location ^~ /api/public-current-visit/ { access_log off; return 404; }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/ssl/workbay/fullchain.pem;
        ssl_certificate_key /etc/ssl/workbay/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location ^~ /v/ { access_log off; return 404; }
        location ^~ /api/public-current-visit/ { access_log off; return 404; }

        # The secret is a browser-only fragment. These exact routes must not fall
        # through to generic logged routing and must overwrite client headers.
        location = /v {
            access_log off;
            limit_req zone=workbai_current_visit_ip burst=5 nodelay;
            proxy_pass http://dashboard;
            proxy_set_header Host $host;
            proxy_set_header X-Workbai-Public-Edge-Verified "1";
            proxy_set_header X-Workbai-Public-Client-IP $remote_addr;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Real-IP "";
            proxy_set_header X-Workbai-Public-Resolver-Key "";
            add_header Cache-Control "no-store, private, max-age=0" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header X-Frame-Options "DENY" always;
            add_header Content-Security-Policy "frame-ancestors 'none'" always;
        }

        location = /api/public-current-visit/resolve {
            access_log off;
            limit_req zone=workbai_current_visit_ip burst=5 nodelay;
            proxy_pass http://dashboard;
            proxy_set_header Host $host;
            proxy_set_header X-Workbai-Public-Edge-Verified "1";
            proxy_set_header X-Workbai-Public-Client-IP $remote_addr;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Real-IP "";
            proxy_set_header X-Workbai-Public-Resolver-Key "";
            add_header Cache-Control "no-store, private, max-age=0" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header X-Frame-Options "DENY" always;
            add_header Content-Security-Policy "frame-ancestors 'none'" always;
        }

        location ~ ^/(health|sessions|checklists|findings|media|vehicle|voice|billing) {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 300s;
        }

        location / {
            proxy_pass http://dashboard;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
